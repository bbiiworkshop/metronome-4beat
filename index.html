<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111"><title>BBiiWMS 四拍節拍器</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css">
</head><body><div>

<header><div class="brand">BBiiworkshop</div><span>視障語音節拍器</span></header>

<section class="card">
<div id="bpm" class="bpm" role="status" aria-live="polite" aria-atomic="true">120 BPM</div>
<button id="voice" class="gold" type="button"><span aria-hidden="true">🎙️</span> 語音輸入 BPM</button>
<button id="playBtn" class="playBtn" type="button">開始播放</button>
</section>

<section class="card">
<p class="section-title">音色選擇</p>
<div class="dropdown">
<button id="soundBtn" class="dropBtn" type="button" aria-haspopup="listbox" aria-expanded="false">音色一</button>
<div id="soundMenu" class="dropMenu" role="listbox">
<button class="dropOpt selected" data-value="click" role="option" aria-checked="true">音色一</button>
<button class="dropOpt" data-value="bell" role="option" aria-checked="false">音色二</button>
<button class="dropOpt" data-value="drum" role="option" aria-checked="false">音色三</button>
</div>
</div>
</section>

<section class="card">
<p class="section-title">拍號選擇</p>
<div class="dropdown">
<button id="meterBtn" class="dropBtn" type="button" aria-haspopup="listbox" aria-expanded="false">4/4</button>
<div id="meterMenu" class="dropMenu" role="listbox">
<button class="dropOpt" data-value="2" role="option" aria-checked="false">2/4</button>
<button class="dropOpt" data-value="3" role="option" aria-checked="false">3/4</button>
<button class="dropOpt selected" data-value="4" role="option" aria-checked="true">4/4</button>
<button class="dropOpt" data-value="6" role="option" aria-checked="false">6/8</button>
</div>
</div>
</section>

<section class="card">
<p class="section-title">節拍顯示</p>
<div id="beatsContainer" class="beats" role="group" aria-label="節奏"></div>
</section>

</div><script src="app.js"></script></body></html>
