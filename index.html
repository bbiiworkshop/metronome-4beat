<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111"><title>BBiiWMS 四拍節拍器</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css">
</head><body><div>
<header><div class="brand">BBiiworkshop</div><h1>視障語音節拍器</h1></header>

<section class="card">
<p class="section-title">目前速度</p>
<div id="bpm" class="bpm" role="status" aria-live="polite" aria-atomic="true">120 BPM</div>
<button id="voice" class="gold" type="button"><span aria-hidden="true">🎙️</span> 語音輸入 BPM</button>
<button id="playBtn" class="playBtn" type="button">開始播放</button>
</section>

<section class="card">
<p class="section-title">音色選擇</p>
<select id="soundSelect" style="width:100%;min-height:48px;font-size:18px;font-weight:700;border:2px solid #555;border-radius:10px;background:#292929;color:#fff;padding:10px 12px;">
<option value="click">音色一（節拍器）</option>
<option value="bell">音色二（鈴鐺）</option>
<option value="drum">音色三（爵士鼓）</option>
</select>
</section>

<section class="card">
<p class="section-title">選擇拍號</p>
<button id="meterBtn" class="meterBtn" type="button">4/4 拍 <span aria-hidden="true">▾</span></button>
<div id="meterMenu" class="meterMenu" style="display:none;">
<button class="meterOpt" data-beats="2">2/4</button>
<button class="meterOpt" data-beats="3">3/4</button>
<button class="meterOpt selected" data-beats="4">4/4</button>
<button class="meterOpt" data-beats="5">5/8</button>
<button class="meterOpt" data-beats="6">6/8</button>
</div>
<div id="accentSection" class="accentSection">
<div class="accentOpts">
<button class="accentOpt selected" data-accent="1">提示音在第一拍</button>
<button class="accentOpt" data-accent="1,3">提示音在1,3拍</button>
<button class="accentOpt" data-accent="2,4">提示音在2,4拍</button>
</div>
</div>
</section>

<section class="card">
<p class="section-title">節拍顯示</p>
<div id="beatsContainer" class="beats" role="group" aria-label="節奏">
<div id="b0" class="beat">1</div><div id="b1" class="beat">2</div><div id="b2" class="beat">3</div><div id="b3" class="beat">4</div>
</div>

</section>

<section class="card">
<p class="section-title">操作說明</p><p>使用 TalkBack 左右滑動。按語音輸入後說出 BPM。選擇拍號（2/4、3/4、4/4、5/8、6/8）。選擇四種節拍音色之一。第一拍一定使用特殊的提示聲。</p></section>
</div><script src="app.js"></script></body></html>
